name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Builds only — deliberately NOT using `npm run publish` (electron-builder's
      # own --publish flag). That path does its own create-or-find-existing-release
      # check against the GitHub API, which raced against a release already existing
      # (e.g. one published manually beforehand) and failed with a 422 "already_exists"
      # trying to create a duplicate. softprops/action-gh-release below is idempotent
      # regardless of whether a release for this tag already exists — same action
      # already used successfully for the framing-data releases.
      # --publish never is required — electron-builder auto-detects it's running
      # in CI against a tag and defaults to trying to publish anyway even without
      # `npm run publish`, then fails outright since no GH_TOKEN is set on this step
      # (publishing is handled entirely by the separate step below instead).
      - name: Build
        run: npm run react-build && npx electron-builder --win --x64 --publish never

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/GachaCompanion-Setup.exe
            dist/GachaCompanion-Setup.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
